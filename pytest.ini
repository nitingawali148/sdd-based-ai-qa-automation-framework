[pytest]
testpaths = ui/tests api/tests
python_files = test_*.py
pythonpath = .
addopts = -ra --strict-markers -p core.pytest_plugin
timeout = 120
markers =
    spec(spec_id, version): specification (and version) the test was generated from
    ac(*ids): acceptance criteria covered
    tc(id): test case ID
    automation_id(id): automation script ID (UI-TEST-* / API-TEST-*)
    priority(level): P1 | P2 | P3
    smoke: smoke suite
    sanity: sanity suite
    functional: functional suite
    regression: regression suite
    ui: browser test
    api: API test
    destructive: modifies or deletes data; needs --allow-destructive
