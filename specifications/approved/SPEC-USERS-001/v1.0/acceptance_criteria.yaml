# SPEC-USERS-001 v1.0 - acceptance criteria
spec_id: SPEC-USERS-001
spec_version: '1.0'
acceptance_criteria:
- id: AC-001
  title: Create a user with a valid name, email and role -> the API returns 201 and the created user
  type: positive
  given: an authenticated admin
  when: they create a user with a valid name, email and role
  then: the API returns 201 and the created user
  channels:
  - api
  inputs:
    name: valid
    email: valid
    role: valid
  expected_ui: null
  expected_api:
    kind: status
    value: '201'
    negate: false
    status_code: 201
    body_contains: ''
    validate_schema: true
  api:
    method: POST
    path: /api/users
    operation_id: createUser
    auth: true
    precondition: none
  start_page: ''
  requirement_id: REQ-002
  source_text: Given an authenticated admin, when they create a user with a valid name, email and role, then the
    API returns 201 and the created user.
- id: AC-002
  title: Create a user with the same email -> "Email already exists" shown
  type: negative
  given: an authenticated admin and an existing user
  when: they create a user with the same email
  then: the API returns 409 with "Email already exists"
  channels:
  - api
  inputs:
    name: valid
    email: duplicate
    role: valid
  expected_ui: null
  expected_api:
    kind: status
    value: '409'
    negate: false
    status_code: 409
    body_contains: Email already exists
    validate_schema: false
  api:
    method: POST
    path: /api/users
    operation_id: createUser
    auth: true
    precondition: duplicate
  start_page: ''
  requirement_id: REQ-002
  source_text: Given an authenticated admin and an existing user, when they create a user with the same email, then
    the API returns 409 with "Email already exists".
