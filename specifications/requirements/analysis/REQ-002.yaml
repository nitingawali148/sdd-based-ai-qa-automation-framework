# Structured requirement REQ-002 - generated by offline-rule-engine. Review before use.
id: REQ-002
title: User Management API
feature: user-management
feature_code: USERS
priority: P1
user_story: As an administrator, I want to create, view, update and delete users through the API so that I can manage
  access to the application.
objective: Provide a secure REST API for managing application users.
business_rules:
- Only authenticated clients can use the user management API.
- A user email must be unique.
- A user name is required and must be at most 100 characters.
- 'A user role must be one of: admin, viewer.'
input_fields:
- name: name
  type: string
  required: true
  min_length: 1
  max_length: 100
  pattern: null
  enum: []
  label: null
  description: 1-100 characters
- name: email
  type: email
  required: true
  min_length: null
  max_length: null
  pattern: null
  enum: []
  label: null
  description: unique
- name: role
  type: enum
  required: true
  min_length: null
  max_length: null
  pattern: null
  enum:
  - admin
  - viewer
  label: null
  description: admin, viewer
acceptance_criteria:
- id: AC-001
  text: Given an authenticated admin, when they create a user with a valid name, email and role, then the API returns
    201 and the created user.
  channels:
  - api
  api_text: ''
- id: AC-002
  text: Given an authenticated admin and an existing user, when they create a user with the same email, then the
    API returns 409 with "Email already exists".
  channels:
  - api
  api_text: ''
- id: AC-003
  text: Given an authenticated admin, when they create a user with an empty email, then the API returns 422.
  channels:
  - api
  api_text: ''
- id: AC-004
  text: Given an authenticated admin and an existing user, when they retrieve the user by id, then the API returns
    200 and the user.
  channels:
  - api
  api_text: ''
- id: AC-005
  text: Given an authenticated admin, when they list users, then the API returns 200 and the list of users.
  channels:
  - api
  api_text: ''
- id: AC-006
  text: Given an authenticated admin and an existing user, when they update the user with a valid name, email and
    role, then the API returns 200 and the updated user.
  channels:
  - api
  api_text: ''
- id: AC-007
  text: Given an authenticated admin and an existing user, when they partially update the user role, then the API
    returns 200 and the updated user.
  channels:
  - api
  api_text: ''
- id: AC-008
  text: Given an authenticated admin and an existing user, when they delete the user, then the API returns 204.
  channels:
  - api
  api_text: ''
- id: AC-009
  text: Given an unauthenticated client, when they list users, then the API returns 401.
  channels:
  - api
  api_text: ''
