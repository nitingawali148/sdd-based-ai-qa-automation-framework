# Structured requirement REQ-001 - generated by offline-rule-engine. Review before use.
id: REQ-001
title: User Login
feature: user-login
feature_code: LOGIN
priority: P1
user_story: As a registered user, I want to log in with my email and password so that I can access my dashboard.
objective: Allow registered users to log in securely.
business_rules:
- Only registered users can log in.
- The email must be a valid email address.
- The password must be between 8 and 64 characters.
- Invalid credentials must not reveal whether the email or the password was wrong.
input_fields:
- name: email
  type: email
  required: true
  min_length: null
  max_length: 254
  pattern: null
  enum: []
  label: Email
  description: max 254 characters
- name: password
  type: password
  required: true
  min_length: 8
  max_length: 64
  pattern: null
  enum: []
  label: Password
  description: 8-64 characters
acceptance_criteria:
- id: AC-001
  text: Given a registered user, when they submit a valid email and password, then they are navigated to the Dashboard
    page.
  channels:
  - ui
  - api
  api_text: returns 200 with "access_token"
- id: AC-002
  text: Given a registered user, when they submit an invalid password, then the error message "Invalid email or
    password" is displayed.
  channels:
  - ui
  - api
  api_text: returns 401 with "Invalid email or password"
- id: AC-003
  text: Given the Login page, when the user submits an empty email, then the validation message "Email is required"
    is displayed.
  channels:
  - ui
  api_text: ''
- id: AC-004
  text: Given the Login page, when the user submits an empty password, then the validation message "Password is
    required" is displayed.
  channels:
  - ui
  api_text: ''
- id: AC-005
  text: Given an unregistered email, when the user submits it with a password, then the error message "Invalid email
    or password" is displayed.
  channels:
  - ui
  - api
  api_text: returns 401 with "Invalid email or password"
- id: AC-006
  text: Given the Login page, when the user submits a password shorter than 8 characters, then the validation message
    "Password must be at least 8 characters" is displayed.
  channels:
  - ui
  api_text: ''
ui_pages:
- name: Login
  path: /login
  elements:
  - label: Email
    role: textbox
  - label: Password
    role: textbox
  - label: Sign in
    role: button
- name: Dashboard
  path: /dashboard
  elements:
  - label: Dashboard
    role: heading
  - label: Sign out
    role: button
api_endpoints:
- method: POST
  path: /api/auth/login
  summary: Authenticate a user and issue an access token
non_functional:
- Login API response time must be under 2 seconds at the 95th percentile.
- Passwords must never be written to logs.
- Authentication must follow the approved security requirements (OWASP ASVS L1).
dependencies:
- A registered test user is available in the target environment.
open_questions: []
ambiguities: []
