# SPEC-LOGIN-001 - automation
spec_id: SPEC-LOGIN-001
spec_version: '1.0'
feature: user-login
framework: python-playwright-pytest-pom + httpx
ui:
  spec_id: SPEC-LOGIN-001
  spec_version: '1.0'
  pages:
  - page: Login
    class_name: LoginPage
    module: login_page
    path: /login
    locators:
    - key: email
      strategy: label
      value: Email
      role: ''
    - key: password
      strategy: label
      value: Password
      role: ''
    - key: sign_in
      strategy: role
      value: Sign in
      role: button
    form_fields:
      email: email
      password: password
    submit_key: sign_in
  - page: Dashboard
    class_name: DashboardPage
    module: dashboard_page
    path: /dashboard
    locators:
    - key: dashboard
      strategy: role
      value: Dashboard
      role: heading
    - key: sign_out
      strategy: role
      value: Sign out
      role: button
    form_fields: {}
    submit_key: sign_out
  tests:
  - automation_id: UI-TEST-LOGIN-001
    test_case_id: TC-LOGIN-001
    function_name: test_tc_login_001_submit_a_valid_email_and_password
    start_page: Login
    fill:
      email: valid
      password: valid
    submit: true
    assertion:
      kind: navigate
      value: Dashboard
      negate: false
      status_code: null
      body_contains: ''
      validate_schema: false
  - automation_id: UI-TEST-LOGIN-003
    test_case_id: TC-LOGIN-003
    function_name: test_tc_login_003_submit_an_invalid_password
    start_page: Login
    fill:
      email: valid
      password: invalid
    submit: true
    assertion:
      kind: message
      value: Invalid email or password
      negate: false
      status_code: null
      body_contains: ''
      validate_schema: false
  - automation_id: UI-TEST-LOGIN-005
    test_case_id: TC-LOGIN-005
    function_name: test_tc_login_005_submits_an_empty_email
    start_page: Login
    fill:
      email: empty
      password: valid
    submit: true
    assertion:
      kind: message
      value: Email is required
      negate: false
      status_code: null
      body_contains: ''
      validate_schema: false
  - automation_id: UI-TEST-LOGIN-006
    test_case_id: TC-LOGIN-006
    function_name: test_tc_login_006_submits_an_empty_password
    start_page: Login
    fill:
      email: valid
      password: empty
    submit: true
    assertion:
      kind: message
      value: Password is required
      negate: false
      status_code: null
      body_contains: ''
      validate_schema: false
  - automation_id: UI-TEST-LOGIN-007
    test_case_id: TC-LOGIN-007
    function_name: test_tc_login_007_submits_it_with_a_password
    start_page: Login
    fill:
      email: unregistered
      password: valid
    submit: true
    assertion:
      kind: message
      value: Invalid email or password
      negate: false
      status_code: null
      body_contains: ''
      validate_schema: false
  - automation_id: UI-TEST-LOGIN-009
    test_case_id: TC-LOGIN-009
    function_name: test_tc_login_009_submits_a_password_shorter_than_8_characters
    start_page: Login
    fill:
      email: valid
      password: too_short
    submit: true
    assertion:
      kind: message
      value: Password must be at least 8 characters
      negate: false
      status_code: null
      body_contains: ''
      validate_schema: false
  - automation_id: UI-TEST-LOGIN-010
    test_case_id: TC-LOGIN-010
    function_name: test_tc_login_010_password_with_exactly_8_characters_does_not
    start_page: Login
    fill:
      email: valid
      password: at_min
    submit: true
    assertion:
      kind: message
      value: Password must be at least 8 characters
      negate: true
      status_code: null
      body_contains: ''
      validate_schema: false
